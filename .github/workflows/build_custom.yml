name: Build Custom APRS Firmware

on:
  workflow_dispatch:
    inputs:
      callsign:
        description: 'Callsign (np. SP7FM-1)'
        required: true
        default: 'N0CALL-1'
      rx_freq:
        description: 'RX Frequency (Hz)'
        required: true
        default: '434855000'
      tx_freq:
        description: 'TX Frequency (Hz)'
        required: true
        default: '434955000'
      coordinates:
        description: 'GPS coordinates APRS (def. !0100.00N/00100.00E)'
        required: true
        default: '!5144.22N/01934.44E'
      rx_sf:
        description: 'RX Spreading Factor'
        required: false
        default: '9'
      rx_bw_idx:
        description: 'RX Signal Bandwidth Index'
        required: false
        default: '7'
      rx_cr:
        description: 'RX Coding Rate'
        required: false
        default: '3'
      rx_power:
        description: 'RX Power (dBm, 2-17)'
        required: false
        default: '17'
      tx_sf:
        description: 'TX Spreading Factor'
        required: false
        default: '9'
      tx_bw_idx:
        description: 'TX Signal Bandwidth Index'
        required: false
        default: '7'
      tx_cr:
        description: 'TX Coding Rate'
        required: false
        default: '3'
      tx_power:
        description: 'TX Power (dBm, 2-20)'
        required: false
        default: '10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install ARM GCC Toolchain (System Package)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version

      - name: Update Configuration (Apply User Inputs)
        run: |
          sed -i 's/#define LORA_RX_FREQ.*/#define LORA_RX_FREQ    ${{ inputs.rx_freq }}/' STM32/Core/Src/main.c
          sed -i 's/#define LORA_TX_FREQ.*/#define LORA_TX_FREQ    ${{ inputs.tx_freq }}/' STM32/Core/Src/main.c
          sed -i 's|#define APRS_CALLSIGN.*|#define APRS_CALLSIGN   "${{ inputs.callsign }}"|' STM32/Core/Src/main.c
          sed -i 's|#define APRS_COORDS.*|#define APRS_COORDS     "${{ inputs.coordinates }}"|' STM32/Core/Src/main.c
          
          # RX
          sed -i 's|#define LORA_RX_SF.*|#define LORA_RX_SF      ${{ inputs.rx_sf }}|' STM32/Core/Src/main.c
          sed -i 's|#define LORA_RX_BW_IDX.*|#define LORA_RX_BW_IDX  ${{ inputs.rx_bw_idx }}|' STM32/Core/Src/main.c
          sed -i 's|#define LORA_RX_CR.*|#define LORA_RX_CR      ${{ inputs.rx_cr }}|' STM32/Core/Src/main.c
          sed -i 's|#define LORA_RX_POWER.*|#define LORA_RX_POWER   ${{ inputs.rx_power }}|' STM32/Core/Src/main.c
          
          # TX
          sed -i 's|#define LORA_TX_SF.*|#define LORA_TX_SF      ${{ inputs.tx_sf }}|' STM32/Core/Src/main.c
          sed -i 's|#define LORA_TX_BW_IDX.*|#define LORA_TX_BW_IDX  ${{ inputs.tx_bw_idx }}|' STM32/Core/Src/main.c
          sed -i 's|#define LORA_TX_CR.*|#define LORA_TX_CR      ${{ inputs.tx_cr }}|' STM32/Core/Src/main.c
          sed -i 's|#define LORA_TX_POWER.*|#define LORA_TX_POWER   ${{ inputs.tx_power }}|' STM32/Core/Src/main.c
          
          echo "Updated main.c from input:"
          grep "#define LORA_RX_FREQ" STM32/Core/Src/main.c
          grep "#define LORA_TX_FREQ" STM32/Core/Src/main.c
          grep "#define APRS_CALLSIGN" STM32/Core/Src/main.c
          grep "#define APRS_COORDS" STM32/Core/Src/main.c
          grep "#define LORA_RX_" STM32/Core/Src/main.c
          grep "#define LORA_TX_" STM32/Core/Src/main.c

      - name: Fix Makefile Absolute Paths and Unsupported Flags
        run: |
          # Fix linker path
          sed -i 's|C:.*STM32F103C8TX_FLASH.ld|../STM32F103C8TX_FLASH.ld|g' STM32/Debug/makefile
          
          # Remove flag -fcyclomatic-complexity from Makefile and subdir.mk
          find STM32/Debug -type f \( -name "makefile" -o -name "*.mk" \) -exec sed -i 's/-fcyclomatic-complexity//g' {} +
          
          echo "Makefile paths and flags updated successfully."

      - name: Build Firmware
        run: |
          make -C STM32/Debug -j4 all


      - name: Build Firmware
        run: |
          make -C STM32/Debug -j4 all

      - name: Rename Binary
        run: |
          mv STM32/Debug/Lora_APRS_repeater.elf Lora_APRS_repeater_${{ inputs.callsign }}.elf

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-${{ inputs.callsign }}
          path: |
            Lora_APRS_repeater_${{ inputs.callsign }}.elf